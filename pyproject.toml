[project]
name = "proteus"
version = "0.1.0"
description = "Voice robots with personas built from atomic prompt traits."
authors = [
    { email = "61751246+michalkrze@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "psycopg[binary]>=3.3.6",
    "sqlalchemy>=2.1.1",
]

[build-system]
requires = ["uv_build>=0.10.7,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "B",       # bugbear: likely bugs
    "UP",      # pyupgrade: modern syntax for the target Python
    "SIM",     # simplifications
    "RUF",     # ruff-specific
]

[tool.mypy]
strict = true
files = ["src"]

[tool.pytest]
testpaths = ["tests"]
addopts = ["-ra"]
strict = true
