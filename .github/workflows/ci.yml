name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # setup-uv publishes only exact version tags, no moving major tag like v10.
      - uses: astral-sh/setup-uv@v10.2.0

      # --locked: fail if uv.lock is out of date with pyproject.toml.
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy
      # Skipped until the first test exists (pytest exits with 5 when it collects nothing).
      - if: hashFiles('tests/**/test_*.py') != ''
        run: uv run pytest
